version: 2.1

commands:
  sync-submodules:
    steps:
      - run: git submodule sync
      - run: git submodule update --init
  checkout-submodules:
    steps:
      - checkout:
          method: blobless
      - sync-submodules

executors:
  go-arm64: &go
    machine:
      image: ubuntu-2604:current
    environment:
      GO_LINUX_CI_IMAGE: &go-image alexfalkowski/go:5.23
    resource_class: arm.medium
  go-amd64:
    <<: *go
    resource_class: medium
  mount-arm64: &mount
    machine:
      image: ubuntu-2604:current
    environment:
      GO_LINUX_CI_IMAGE: *go-image
    resource_class: arm.medium
  mount-amd64:
    <<: *mount
    resource_class: medium
  coverage:
    docker:
      - image: *go-image
    resource_class: arm.medium
  release:
    docker:
      - image: alexfalkowski/release:8.49
  alpine:
    docker:
      - image: alpine:latest

jobs:
  build:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: go-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make verify-rootless-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >> kernel=7.0
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=rootless-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - rootless-<< parameters.arch >>
  build-netlink:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: go-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make verify-netlink-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >> kernel=7.0
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=netlink-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - netlink-<< parameters.arch >>
  build-namespace:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: go-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make verify-namespace-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >> kernel=7.0
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=namespace-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - namespace-<< parameters.arch >>
  build-cgroup:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: go-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make verify-cgroup-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >> kernel=7.0
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=cgroup-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - cgroup-<< parameters.arch >>
  build-mount:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: mount-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make verify-mount-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >>
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=mount-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - mount-<< parameters.arch >>
  build-fanotify:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: mount-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make verify-fanotify-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >>
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=fanotify-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - fanotify-<< parameters.arch >>
  build-timerfd:
    parameters:
      arch:
        type: enum
        enum: [arm64, amd64]
    executor: mount-<< parameters.arch >>
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run:
          name: Disable clock synchronization in this disposable VM
          command: sudo timedatectl set-ntp false
      - run: make verify-timerfd-container image="$GO_LINUX_CI_IMAGE" arch=<< parameters.arch >> clock_change=true
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=timerfd-<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp/go-linux-reports
          paths:
            - timerfd-<< parameters.arch >>
  coverage:
    executor: coverage
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/go-linux-reports
      - run: make coverage-workspace-merge
      - run: make coverage
      - store_artifacts:
          path: test/reports
      - run: make codecov-upload
  sync:
    executor: release
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: make sync push
    resource_class: arm.large
  version:
    executor: release
    working_directory: ~/go-linux
    steps:
      - checkout-submodules
      - run: version
      - run: package
    resource_class: arm.large
  wait-all:
    executor: alpine
    resource_class: small
    steps:
      - run: echo "all applicable jobs finished"

workflows:
  go-linux:
    jobs:
      - build:
          name: build-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - build-netlink:
          name: build-netlink-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - build-namespace:
          name: build-namespace-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - build-cgroup:
          name: build-cgroup-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - build-mount:
          name: build-mount-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - build-fanotify:
          name: build-fanotify-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - build-timerfd:
          name: build-timerfd-<< matrix.arch >>
          matrix:
            parameters:
              arch: [arm64, amd64]
      - coverage:
          requires:
            - build
            - build-netlink
            - build-namespace
            - build-cgroup
            - build-mount
            - build-fanotify
            - build-timerfd
      - sync:
          requires:
            - coverage
          filters: 'pipeline.git.branch != "master"'
      - version:
          context: gh
          serial-group: << pipeline.project.slug >>/version
          requires:
            - coverage
          filters: 'pipeline.git.branch == "master"'
      - wait-all:
          requires:
            - coverage
            - sync
            - version
